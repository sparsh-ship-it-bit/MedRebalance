services:
  - type: web
    name: medrebalance-v2
    runtime: docker
    plan: free
    dockerfilePath: ./v2/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medrebalance-v2-db
          property: connectionString
      - key: PORT
        value: "8080"

databases:
  - name: medrebalance-v2-db
    databaseName: medrebalance_v2
    user: medrebalance
    plan: free
