services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: medrebalance_v2
      POSTGRES_USER: medrebalance
      POSTGRES_PASSWORD: medrebalance_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U medrebalance -d medrebalance_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: v2/Dockerfile
    environment:
      DATABASE_URL: postgres://medrebalance:medrebalance_local@db:5432/medrebalance_v2?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
